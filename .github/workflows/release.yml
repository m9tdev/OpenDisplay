# Builds, signs, and notarizes OpenDisplay on the self-hosted runner on brick01 (Linux, nix-apple-dev), and
# publishes the GitHub release for the tag. scripts/make-release.sh makes the tag, with the release notes as its
# message.
#
# The repository is public, and this runs on our own server with the signing secrets. So it runs only for v* tags
# (and manual starts on a tag), never for pull requests. The secrets are in the "release" environment, which
# GitHub allows only for v* tags.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: [self-hosted, brick01-apple]
    environment: release
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag and the version
        run: |
          case "$GITHUB_REF" in
            refs/tags/v*) ;;
            *) echo "Run this on a v* tag, not on $GITHUB_REF." >&2; exit 1 ;;
          esac
          version="$(python3 -c 'import plistlib; print(plistlib.load(open("Resources/Info.plist", "rb"))["CFBundleShortVersionString"])')"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "The tag is $GITHUB_REF_NAME, but Resources/Info.plist has version $version." >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Build, sign, and notarize
        env:
          DEVELOPER_ID_KEY_PEM: ${{ secrets.DEVELOPER_ID_KEY_PEM }}
          DEVELOPER_ID_CERT_PEM: ${{ secrets.DEVELOPER_ID_CERT_PEM }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          # The repository variable APPLE_DEV_FLAKE can point to another flake, for example a local checkout.
          APPLE_DEV_FLAKE: ${{ vars.APPLE_DEV_FLAKE || 'github:m9tdev/nix-apple-dev' }}
        run: scripts/build-app-linux.sh --notarize

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The checkout has the tag without its message, so fetch the annotated tag: its message is the release notes.
          git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          # Without the tag's signature (tags can be signed), which git puts after the message.
          git tag -l --format='%(contents:subject)%0a%0a%(contents:body)' "$GITHUB_REF_NAME" \
            | sed '/^-----BEGIN \(SSH\|PGP\) SIGNATURE-----$/,$d' > build/notes.md
          zip="build/OpenDisplay-$VERSION.zip"
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            # A run again for the same tag: replace the zip.
            gh release upload "$GITHUB_REF_NAME" "$zip" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$zip" --verify-tag --title "OpenDisplay $VERSION" --notes-file build/notes.md
          fi

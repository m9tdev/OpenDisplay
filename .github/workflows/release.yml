# Releases with release-please. On each push to main, release-please keeps a release pull request up to date: the next
# version (in version.txt) and CHANGELOG.md, from the commit messages (feat: raises the minor version, fix: the patch
# version). When that pull request is merged, release-please makes a draft release with its tag, and the build job
# builds, signs, and notarizes OpenDisplay on a GitHub-hosted macOS runner (Xcode 27), attaches the zip and the Sparkle
# update feed (appcast.xml), and publishes the release. A manual start on a v* tag builds that release again.
#
# It never runs for pull requests. The signing, notary, and Sparkle keys are secrets of the "release" environment,
# which GitHub allows only for main and v* tags. Each secret is given only to the step that needs it.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Runs for the same ref wait for each other, so two releases never build at the same time.
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    needs: release-please
    # After a merged release pull request, or a manual start on a v* tag (to build a release again).
    if: >-
      always() && (needs.release-please.outputs.release_created == 'true'
      || (github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/tags/v')))
    # Xcode 27 with the macOS 27 SDK (public preview image, Apple silicon).
    runs-on: xcode-27
    environment: release
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      TAG: ${{ needs.release-please.outputs.tag_name || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false

      - name: Check the tag and the version
        run: |
          version="$(scripts/version.sh)"
          if [ "v$version" != "$TAG" ]; then
            echo "The tag is $TAG, but version.txt has version $version." >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          xcodebuild -version

      - name: Put the Developer ID in a temporary keychain
        env:
          DEVELOPER_ID_KEY_PEM: ${{ secrets.DEVELOPER_ID_KEY_PEM }}
          DEVELOPER_ID_CERT_PEM: ${{ secrets.DEVELOPER_ID_CERT_PEM }}
        run: |
          : "${DEVELOPER_ID_KEY_PEM:?The secret DEVELOPER_ID_KEY_PEM is missing}" "${DEVELOPER_ID_CERT_PEM:?The secret DEVELOPER_ID_CERT_PEM is missing}"
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(uuidgen)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          # The key and the certificate as a .p12, only for the import.
          dir="$(mktemp -d)"
          (umask 077
            printf '%s\n' "$DEVELOPER_ID_KEY_PEM" > "$dir/key.pem"
            printf '%s\n' "$DEVELOPER_ID_CERT_PEM" > "$dir/cert.pem"
            # macOS openssl (LibreSSL): Homebrew OpenSSL 3 writes .p12 files that security cannot import.
            /usr/bin/openssl pkcs12 -export -inkey "$dir/key.pem" -in "$dir/cert.pem" -out "$dir/id.p12" -passout "pass:$password")
          security import "$dir/id.p12" -k "$keychain" -P "$password" -T /usr/bin/codesign
          rm -rf "$dir"
          # The intermediate certificate of Developer ID (G2), so codesign can build the chain to Apple's root.
          curl -fsSL https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer -o "$RUNNER_TEMP/DeveloperIDG2CA.cer"
          security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$keychain"
          # Let codesign use the key without a prompt, and search this keychain first.
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identity="$(security find-identity -v -p codesigning "$keychain" | awk -F'"' '/Developer ID Application/ { print $2; exit }')"
          [ -n "$identity" ] || { echo "No Developer ID Application identity in the keychain." >&2; exit 1; }
          echo "SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"

      - name: Build and sign
        run: scripts/build-app.sh

      - name: Notarize
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          : "${ASC_KEY_P8:?The secret ASC_KEY_P8 is missing}"
          scripts/notarize.sh
          spctl --assess --type execute --verbose=2 build/OpenDisplay.app

      - name: Make the update feed
        env:
          GH_TOKEN: ${{ github.token }}
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          : "${SPARKLE_ED_PRIVATE_KEY:?The secret SPARKLE_ED_PRIVATE_KEY is missing}"
          # The release notes that release-please wrote (from CHANGELOG.md), as HTML for the update window, made by
          # GitHub's own markdown renderer.
          gh release view "$TAG" --json body --jq .body > build/notes.md
          gh api markdown -f text="$(cat build/notes.md)" -f mode=gfm > build/notes.html
          scripts/make-appcast.sh build/notes.html

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Attach the files first, then publish: so the latest release always has them. The app reads appcast.xml
          # from the latest release (SUFeedURL in Info.plist).
          gh release upload "$TAG" "build/OpenDisplay-$VERSION.zip" build/appcast.xml --clobber
          gh release edit "$TAG" --draft=false --latest --title "OpenDisplay $VERSION"

      - name: Remove the temporary keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
